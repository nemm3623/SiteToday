name: 버그 보고
description: 문제를 재현하고 수정 결과를 확인할 기준을 기록합니다.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 발생 환경, 사전 조건과 재현 순서를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 관찰한 동작이나 오류를 적어 주세요. 로그에서 인증 정보는 제거해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 같은 조건에서 기대한 동작을 적어 주세요.
    validations:
      required: true
