name: 개발 작업
description: 리팩터링, 테스트, 문서 등 유지보수 작업을 정의합니다.
labels: ["maintenance"]
body:
  - type: textarea
    id: context
    attributes:
      label: 작업 이유
      description: 현재 어떤 개선이 필요한가요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      description: 변경 대상과 범위를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 검증 방법
      description: 완료 여부를 어떻게 확인할 수 있나요?
    validations:
      required: true
