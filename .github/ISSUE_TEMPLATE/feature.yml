name: 기능 제안
description: 사용자가 필요한 기능과 완료 조건을 정의합니다.
labels: ["feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: 배경과 목적
      description: 누가 어떤 상황에서 겪는 문제인가요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 추가하거나 변경할 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 어떤 결과를 확인하면 완료인가요?
    validations:
      required: true
